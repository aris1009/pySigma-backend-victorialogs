name: E2E (synthetic — per-PR fast lane)

# Synthetic-only ingest correctness gate that runs on every PR.
#
# The full e2e harness (Windows EventLog via OTRF + vmalert) runs
# nightly via e2e-nightly.yml. This workflow exercises the four
# non-Windows pipelines (caddy / journald / podman / suricata)
# against deterministic synthetic datasets so a PR that silently
# breaks ingest surfaces in <2 min instead of overnight.
#
# Triggers:
#   - pull_request: gates merges to main on ingest-level correctness.
#   - workflow_dispatch: manual run from the Actions tab.

on:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: e2e-fast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-synth:
    name: Synthetic e2e (caddy/journald/podman/suricata)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263  # v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry virtualenv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .venv
          key: venv-e2e-fast-${{ runner.os }}-py3.12-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Cache datasets
        # Synthetic generators run in milliseconds, so the cache key is
        # really just the manifest. OTRF entries are also fetched here so
        # the dataset cache is shared with the nightly workflow on warm
        # runners — but the fast lane does not load OTRF into VL.
        id: dataset-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            e2e/datasets
            e2e/.cache
          key: e2e-datasets-${{ hashFiles('e2e/datasets.yml') }}

      - name: Materialise datasets (cache miss only)
        if: steps.dataset-cache.outputs.cache-hit != 'true'
        run: make e2e-fetch

      - name: Clone SigmaHQ corpus
        # Pinned-commit clone; the e2e harness reads upstream Sigma rules
        # from SIGMA_CORPUS_PATH so we test the exact rule a real user
        # would deploy.
        run: git clone --depth=1 https://github.com/SigmaHQ/sigma /tmp/sigma-rules

      - name: Bring up VictoriaLogs
        # `make live-up` starts only the VL service (no Vector, no
        # vmalert) — the four synthetic harnesses POST NDJSON straight
        # to VL via /insert/jsonline.
        run: make live-up

      - name: Run synthetic e2e harness
        env:
          SIGMA_CORPUS_PATH: /tmp/sigma-rules
          VL_E2E_URL: http://localhost:9428
          E2E_DATASETS_DIR: ${{ github.workspace }}/e2e/datasets
        run: make e2e-test-synth

      - name: Capture compose logs (on failure)
        if: failure()
        run: |
          mkdir -p compose-logs
          docker compose -f e2e/docker-compose.yml logs --no-color > compose-logs/docker-compose.log 2>&1 || true
          echo "::group::docker compose logs"
          cat compose-logs/docker-compose.log || true
          echo "::endgroup::"

      - name: Upload compose logs artifact
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: compose-logs-fast-${{ github.run_id }}
          path: compose-logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Tear down stack
        if: always()
        run: make live-down
