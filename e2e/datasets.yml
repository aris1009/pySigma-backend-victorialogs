# Manifest of datasets used by the e2e harness.
#
# Each entry pins a specific upstream artefact (or synthetic generator
# inputs) by sha256 so that fetches are reproducible and the harness
# fails closed on tamper / non-determinism. The fetcher
# (dev/fetch_datasets.py, invoked by `make e2e-fetch`) materialises
# every entry into e2e/datasets/<target>.
#
# Source kinds:
#   - source: otrf | evtx-samples
#       Download an archive from a pinned URL, sha256-verify the bytes,
#       extract the JSON member into <target>. Required fields:
#       url, archive (raw|zip|gzip), sha256, target. Optional: member.
#   - source: synthetic
#       Run dev.synth.<generator>(seed, count) and serialise its output
#       deterministically. The sha256 covers the *output bytes*. Required
#       fields: generator, seed, count, sha256, target. Must NOT declare
#       url/archive/member.
#
# Adding a new dataset:
#   1. Add the entry below (leave sha256 empty).
#   2. Run `python dev/fetch_datasets.py --pin` to compute and
#      write back the sha256.
#   3. Commit the updated manifest.
#
# Updating an upstream pin (commit hash in the URL) or a synthetic
# generator's content:
#   1. Bump the URL / generator code.
#   2. Clear the sha256 field for that entry.
#   3. Run `--pin` again, commit.
#
# Note on shape: OTRF Security-Datasets ships in mordor JSON shape (top-level
# Channel, EventID, etc. — NOT winlog.* prefixed). The Vector pipeline
# is responsible for remapping these into the
# winlog.{channel,event_id,event_data.*} layout the
# victorialogs_windows_eventlog() pipeline targets. Synthetic non-Windows
# datasets are emitted directly in the pipeline-target shape — no Vector
# transform needed; ingest via /insert/jsonline directly.

